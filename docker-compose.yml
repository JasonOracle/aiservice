version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - UPLOAD_DIR=/app/uploads
      - JWT_SECRET=aiservice-mvp-secret-key-change-in-production
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    restart: unless-stopped

  toc:
    build:
      context: ./toc
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
        - NEXT_PUBLIC_WS_URL=ws://localhost:8080
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
      - WATCHPACK_POLLING=true
    volumes:
      - ./toc:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

  tob:
    build:
      context: ./tob
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
        - NEXT_PUBLIC_WS_URL=ws://localhost:8080
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
      - ADMIN_PASS=admin123
      - WATCHPACK_POLLING=true
    volumes:
      - ./tob:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
