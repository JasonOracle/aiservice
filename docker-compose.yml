version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8080:8000"
    env_file:
      # 项目根 .env —— 模型 API Key（XIAO_HONG_SHU_API_KEY 等）的权威来源。
      # required: false —— .env 已被 gitignore，新克隆的仓库不会有该文件，
      # 缺失时不应导致 compose 启动失败（此时 /api/health 会返回 llm_configured=false）。
      # 注：下方 environment 段优先级更高，会覆盖同名变量。
      - path: .env
        required: false
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - UPLOAD_DIR=/app/uploads
      - JWT_SECRET=aiservice-mvp-secret-key-change-in-production
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    restart: unless-stopped

  toc:
    build:
      context: ./toc
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
        - NEXT_PUBLIC_WS_URL=ws://localhost:8080
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
      - WATCHPACK_POLLING=true
    volumes:
      - ./toc:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

  tob:
    build:
      context: ./tob
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
        - NEXT_PUBLIC_WS_URL=ws://localhost:8080
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
      - ADMIN_PASS=admin123
      - WATCHPACK_POLLING=true
    volumes:
      - ./tob:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
